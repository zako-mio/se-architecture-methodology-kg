4","MTH-K-05","MTH-K-06","MTH-K-07","ESS-L-05","MTH-L-04","MTH-L-05","ESS-M-01","ESS-M-02","ESS-M-03","ESS-M-04","ESS-M-05","MTH-M-01","MTH-M-02","MTH-M-03","MTH-M-04","MTH-M-05","MTH-M-06","ESS-O-03","MTH-O-01","MTH-O-05","MTH-O-09","MTH-O-11","MTH-G-05","MTH-G-06","ESS-H-08","ESS-H-09","MTH-H-04","CAS-X-02","CAS-X-03","CAS-X-05","CAS-X-08","CAS-X-10","CAS-X-11","CAS-X-12","CAS-X-13","CAS-X-14","CAS-X-15","CAS-X-16","CAS-X-17","CAS-X-18","TEC-F-01","TEC-G-01","TEC-G-02","TEC-G-03","TEC-H-01","TEC-H-02","TEC-H-03","TEC-I-01","TEC-I-02","TEC-I-03","TEC-J-01","TEC-J-02","TEC-J-03","TEC-J-04","TEC-J-06","TEC-K-01","TEC-K-02","TEC-K-03","TEC-K-04","TEC-K-05","TEC-K-06","TEC-L-01","TEC-M-01","TEC-M-02","TEC-M-03","ESS-G-04","ESS-G-05","MTH-G-01","MTH-G-02","MTH-G-03"]},{"id":"GCC-P","name":"横切·技术债","domain":"L","kind":"crosscut","stage_range":["basic","intermediate","advanced"],"node_ids":["ESS-L-01","ESS-L-02","ESS-L-03","ESS-L-04","ESS-L-05","MTH-L-01","MTH-L-02","MTH-L-03","MTH-L-06","MTH-L-07","MTH-O-10","ESS-H-09","MTH-H-03","CAS-X-04","CAS-X-05","CAS-X-06","CAS-X-07","CAS-X-08","CAS-X-10","CAS-X-12","CAS-X-14","CAS-X-15","CAS-X-16","TEC-F-02","TEC-H-01","TEC-H-02","TEC-H-03","TEC-J-02","TEC-L-02","TEC-M-02","MTH-H-01"]},{"id":"GCC-N","name":"横切·团队与康威","domain":"N","kind":"crosscut","stage_range":["basic","intermediate","advanced"],"node_ids":["ESS-N-01","MTH-I-03","MTH-K-05","ESS-N-02","ESS-N-03","ESS-N-04","ESS-N-05","MTH-N-01","MTH-N-02","MTH-N-03","MTH-N-04","MTH-N-05","MTH-N-06","MTH-O-06","MTH-O-09","MTH-O-11","MTH-H-04","CAS-X-11","CAS-X-13","CAS-X-17","CAS-X-18","TEC-N-01","TEC-N-02","TEC-J-05","TEC-J-06","TEC-K-03","TEC-K-05","TEC-K-06","MTH-G-04"]},{"id":"GC-CASE","name":"案例层","domain":"H","kind":"case","stage_range":["intermediate","advanced"],"node_ids":["CAS-X-01","CAS-X-02","CAS-X-03","CAS-X-04","CAS-X-05","CAS-X-06","CAS-X-07","CAS-X-08","CAS-X-09","CAS-X-10","CAS-X-11","CAS-X-12","CAS-X-13","CAS-X-14","CAS-X-15","CAS-X-16","CAS-X-17","CAS-X-18"]}],"nodes":[{"id":"ESS-H-01","name":"信息隐藏","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"以「隐藏困难或可能变化的设计决策」作为模块分解判据：每个模块把一类易变决策封装为自己的秘密，接口只揭示尽量少的内部工作，使变更局部化。它规定的是划分依据与边界，而非模块的物理形态或大小。它是模块化有效性的根本来源之一。","layer":"essence","domain":"H","status":"active"},{"id":"ESS-H-02","name":"内聚与耦合","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"衡量模块划分质量的两个互补维度：内聚是模块内部元素隶属同一目标的程度，耦合是模块之间相互依赖的程度。目标是高内聚、低耦合，但二者只是启发式方向，并非有普适阈值的绝对指标。它衡量的是结构对变更的承载能力。","layer":"essence","domain":"H","case":["CAS-X-05"],"status":"active"},{"id":"ESS-H-03","name":"DRY 单一知识来源","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"系统内每个知识点应有单一、无歧义、权威的表示，避免同一知识的多份副本各自漂移。它针对的是「知识重复」而非机械的代码重复，核心判据是：一处规则改变时，是否需要在多个位置同步修改。它衡量的是知识的归属是否清晰。","layer":"essence","domain":"H","case":["CAS-X-03","CAS-X-04"],"status":"active"},{"id":"ESS-H-04","name":"抽象泄漏","type":"principle","group":"GL-ESSENCE","stage":"advanced","brief":"所有非平凡抽象都会在不同程度上泄漏其底层实现：性能、故障与边界行为会穿透抽象边界，使用者被迫了解本应被隐藏的细节。这是抽象与封装固有的边界，而非实现缺陷。它要求设计者主动管理而非幻想消除这种穿透。","layer":"essence","domain":"H","case":["CAS-X-07"],"status":"active"},{"id":"ESS-G-01","name":"关注点分离","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"把系统按不同的关注点（功能、质量、变化原因、生命周期等）分解为可独立处理的部分，使每部分只承担一组相关职责。它是分解问题的元原则，为具体的模块化与分层提供依据。它的成败取决于维度是否真正正交。","layer":"essence","domain":"G","case":["CAS-X-01","CAS-X-13"],"status":"active"},{"id":"ESS-G-02","name":"依赖倒置与依赖规则","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"稳定策略不应依赖易变细节：通过抽象使高层策略与低层实现都依赖抽象，让源码依赖方向指向更稳定、更抽象的一端。它为分层与插件式架构提供依据。它使核心策略可以在实现细节变化时保持稳定。","layer":"essence","domain":"G","case":["CAS-X-03","CAS-X-05","CAS-X-08","CAS-X-10"],"status":"active"},{"id":"ESS-G-03","name":"边界与接口隔离","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"在模块、服务与层之间显式划定边界，并让跨边界交互仅通过窄而稳定的接口进行，把内部实现与外部契约隔离开。边界决定变更传播范围与理解成本。它要求把跨边界交互收敛为显式承诺。","layer":"essence","domain":"G","case":["CAS-X-02","CAS-X-05","CAS-X-08"],"status":"active"},{"id":"ESS-O-01","name":"本质复杂度与偶然复杂度","type":"principle","group":"GL-ESSENCE","stage":"advanced","brief":"软件复杂度分为本质复杂度——问题本身固有的概念结构，无法被任何单一技术或管理消除——与偶然复杂度——由工具、方法与实现引入、可被削减的部分。区分二者决定优化投向。它指导工程师把有限的精力投向真正可削减之处。","layer":"essence","domain":"O","case":["CAS-X-13"],"status":"active"},{"id":"ESS-O-02","name":"架构即权衡","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"架构决策是在相互冲突的质量属性与约束之间做出的取舍，没有普适最优解，只有特定语境下对代价与收益的平衡。它要求把隐含假设显式化并记录取舍依据。它把决策从对错判断转为有依据的取舍。","layer":"essence","domain":"O","cc":["M"],"case":["CAS-X-01","CAS-X-12"],"status":"active"},{"id":"ESS-L-01","name":"软件演化定律","type":"principle","group":"GL-ESSENCE","stage":"advanced","brief":"描述 E 型软件在持续演化中反复出现的规律：系统必须持续变更否则逐渐失效，而持续变更又使复杂度递增、质量下降，需要以自我调节与反馈治理。它把演化视为常态而非异常。它把演化确立为需要持续投入的常态过程。","layer":"essence","domain":"L","cc":["P"],"status":"active"},{"id":"ESS-N-01","name":"康威定律","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"设计系统的组织受沟通结构约束，其产出会复制该组织的沟通结构；系统架构与组织结构之间存在保结构的对应关系。它提示架构设计与组织设计必须协同。它把组织设计纳入架构决策的范畴。","layer":"essence","domain":"N","cc":["N"],"status":"active"},{"id":"ESS-F-01","name":"软件需求","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"软件需求是「须被某物展现、以解决现实世界问题的属性」；它描述系统应满足的「什么（what）」而非「如何做（how）」，属于对解决方案的约束与对问题空间的陈述，而非设计决定。","layer":"essence","domain":"F","cc":["M"],"status":"active"},{"id":"ESS-F-02","name":"干系人与需要","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"干系人是对系统或其具备满足其需要与期望的特性拥有权利、份额、主张或利益的个人或组织；需要是对其 needs、wants、desires、expectations 与感知约束的引出，需求则由需要转化而来。","layer":"essence","domain":"F","status":"active"},{"id":"ESS-F-03","name":"需求可追溯性与可验证性","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"可追溯性要求每条需求都能双向链接到其来源与后续制品，可验证性要求能用客观方法判定需求是否被满足；两者共同使需求可被确认、变更影响可被分析。","layer":"essence","domain":"F","cc":["M"],"status":"active"},{"id":"ESS-F-04","name":"需求的不确定性与变更","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"需求在初始阶段总是不完整、模糊，并会随环境与认知变化而被修订；成功的软件必然被改变，因此需求管理必须把变更视为常态，而非应被消除的异常。","layer":"essence","domain":"F","status":"active"},{"id":"ESS-F-05","name":"业务与任务价值","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"需求源于业务或任务的价值目标：先定义问题或机会空间、评估备选方案，再由此导出干系人需要与系统需求，使每条需求都能回答它在为谁创造何种价值。","layer":"essence","domain":"F","status":"active"},{"id":"MTH-F-01","name":"需求工程过程","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"以业务或任务分析为起点，依次经干系人需要与需求定义、系统需求定义，并在各技术过程中嵌入需求活动，由需求管理贯穿的过程链；其信息项包括业务、干系人、系统与软件需求规格。","layer":"methodology","domain":"F","case":["CAS-X-17"],"status":"active"},{"id":"MTH-F-02","name":"需求获取","type":"method","group":"GL-METHOD","stage":"basic","brief":"系统化地从干系人、领域文档、现有系统与运行环境等来源引出需要与需求的实践；目标不是记录已陈述的诉求，而是发现真实、隐含乃至尚未成形的需要。","layer":"methodology","domain":"F","status":"active"},{"id":"MTH-F-03","name":"干系人识别与分析","type":"method","group":"GL-METHOD","stage":"basic","brief":"系统识别受系统影响或能影响系统的个人与组织，分析其关注点、影响力与需要，并持续维护覆盖多层级角色的干系人视图的方法。","layer":"methodology","domain":"F","status":"active"},{"id":"MTH-F-04","name":"需求规格说明","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"把需求以明确、无歧义、可验证的方式文档化为信息项（如软件需求规格说明）的方法，要求单条需求具备必要、无歧义、单一、可行、可验证等特性，需求集具备一致、完整、可理解等特性。","layer":"methodology","domain":"F","case":["CAS-X-14"],"status":"active"},{"id":"MTH-F-05","name":"功能与非功能需求分类","type":"method","group":"GL-METHOD","stage":"basic","brief":"把软件需求区分为功能需求（软件须执行的功能与行为）与非功能需求（功能之外的质量约束与属性），并另行识别技术约束与服务质量约束的分类方法。","layer":"methodology","domain":"F","cc":["M"],"status":"active"},{"id":"MTH-F-06","name":"需求属性与优先级","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"为每条需求赋予唯一标识、优先级、依据与假定难度等属性，并据此对需求排序与范围匹配，使有限的工程投入投向最高价值与最必要的需求。","layer":"methodology","domain":"F","status":"active"},{"id":"ESS-I-01","name":"测试作为验证与反馈机制本质","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"软件测试是以发现缺陷、评估质量为目的的活动集合；其本质不止于事后验证——它同时为开发提供持续反馈，使团队能在变更中保持正确性，因此测试是质量保障与支持演进的双重机制。","layer":"essence","domain":"I","cc":["M"],"status":"active"},{"id":"ESS-I-02","name":"可测试性本质","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"可测试性是建立系统、产品或组件的测试准则，并执行测试以判定这些准则是否被满足的有效性与效率程度；它由可观察性、可控制性与判据明确性共同决定，是系统结构赋予测试的可行性。","layer":"essence","domain":"I","cc":["M"],"status":"active"},{"id":"ESS-I-03","name":"错误、缺陷与失效","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"错误是人的行为产生的不正确结果，缺陷是制品中导致其偏离预期行为的瑕疵，失效是系统运行时表现出的与规定行为不一致；三者构成「错误→缺陷→失效」的因果链，是测试活动的认知对象。","layer":"essence","domain":"I","cc":["M"],"status":"active"},{"id":"ESS-I-04","name":"测试的不可穷尽性","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"测试只能证明缺陷的存在、无法证明其不存在；由于输入、状态与执行路径的组合空间在现实中不可穷尽，测试永远是抽样活动，因此测试策略的核心不是穷尽验证，而是基于风险选择最有价值的样本。","layer":"essence","domain":"I","cc":["M"],"status":"active"},{"id":"MTH-I-01","name":"测试层次","type":"method","group":"GL-METHOD","stage":"basic","brief":"测试层次是按开发生命周期阶段组织并一起管理的测试活动分组，通常从组件级逐层上升到系统级与验收级；每个层次针对不同的测试对象与关注点，回答不同的问题，并对应不同的缺陷类型与执行主体。","layer":"methodology","domain":"I","cc":["M"],"status":"active"},{"id":"MTH-I-02","name":"测试类型","type":"method","group":"GL-METHOD","stage":"basic","brief":"测试类型是与特定质量特性相关的一组测试活动，如功能测试与非功能测试，也可按是否依赖内部结构分为黑盒、白盒与经验型；大多数测试类型可应用于每一个测试层次，层次与类型是两个正交的坐标。","layer":"methodology","domain":"I","cc":["M"],"status":"active"},{"id":"MTH-I-03","name":"测试驱动开发","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"测试驱动开发（TDD）是先写测试、再写实现、随后重构的开发技术，核心为红-绿-重构三步循环：先写一个失败的测试明确目标，再以最小实现使其通过，最后在测试保护下改善结构。","layer":"methodology","domain":"I","cc":["M","N"],"status":"active"},{"id":"MTH-I-04","name":"测试金字塔与反模式","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"测试金字塔是按粒度与数量组织自动化测试的模型：底层应有多得多的快速隔离单元测试，中层为适量服务/集成测试，顶层为少量端到端测试；倒置的金字塔（冰淇淋甜筒）与缺失中间层的沙漏是典型反模式。","layer":"methodology","domain":"I","cc":["M"],"status":"active"},{"id":"MTH-I-05","name":"测试替身与测试策略","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"测试替身是在测试中替换生产对象的任何协作对象的泛称，包括哑元、伪造、桩、监视与模拟五类；按需要隔离的程度选择替身类型，并控制替身的使用范围，是平衡测试速度、确定性与保真度的关键策略。","layer":"methodology","domain":"I","cc":["M"],"status":"active"},{"id":"MTH-I-06","name":"质量门控与持续集成","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"持续集成要求开发者频繁把改动合并回主线，并由自动化构建与测试验证；质量门控则用一组在分析时度量的条件判定制品是否可发布，任一条件不满足即阻断构建或合并，把测试与质量检查制度化为交付闸门。","layer":"methodology","domain":"I","cc":["M"],"case":["CAS-X-15","CAS-X-18"],"status":"active"},{"id":"MTH-I-07","name":"软件测试过程模型","type":"method","group":"GL-METHOD","stage":"advanced","brief":"软件测试过程模型把测试描述为可治理、可管理、可实施的分层过程：组织级制定测试方针与策略，管理级规划、监控与收尾测试项目，动态级设计、实现、执行并报告具体测试，可配合不同开发生命周期使用。","layer":"methodology","domain":"I","cc":["M"],"status":"active"},{"id":"ESS-J-01","name":"构建发布运行分离","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"软件交付须严格分离构建、发布、运行三阶段：构建把代码转换为可执行制品，发布把制品与当次配置合并为带唯一标识的不可变版本，运行只启动选定版本，且运行阶段不存在把改动写回构建的通道。","layer":"essence","domain":"J","status":"active"},{"id":"ESS-J-02","name":"开发生产一致性","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"开发、预发与生产环境应尽可能相似，把时间差、人员差与工具差压到最小，并使用同类型同版本的支撑服务，使在早期环境中验证过的行为在生产中依然成立。","layer":"essence","domain":"J","status":"active"},{"id":"ESS-J-03","name":"不可变基础设施","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"部署完成后的基础设施（服务器、网络设备、运行实例）不再被就地修改，任何变更都通过创建新版本并替换实例实现，从而把运行环境的实际状态锚定在经测试的制品上。","layer":"essence","domain":"J","status":"active"},{"id":"ESS-J-04","name":"部署即变更管理","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"部署不是一次性的文件拷贝，而是一次受控、可审计、可回滚的变更：应明确谁在何时以何制品更改了哪个环境的什么状态，并为失败预留恢复路径。","layer":"essence","domain":"J","cc":["M"],"status":"active"},{"id":"MTH-J-01","name":"部署流水线","type":"method","group":"GL-METHOD","stage":"basic","brief":"把从代码到生产的交付拆为多个自动阶段，每阶段提升置信度（通常以更多时间为代价），只构建一次并让同一制品逐环境提升，从而尽早检出会导致生产问题的变更。","layer":"methodology","domain":"J","status":"active"},{"id":"MTH-J-02","name":"发布工程","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"以可复现、自动化的方式构建并交付软件的工程学科，覆盖源码管理、编译、构建配置、包管理与安装，确保每次发布都可重复，而非一次性的独特雪花。","layer":"methodology","domain":"J","status":"active"},{"id":"MTH-J-03","name":"封闭构建","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"对构建机器已安装的库与软件不敏感、只依赖已知版本编译器与库的自足构建过程，使同一版本在不同机器上构建得到一致结果。","layer":"methodology","domain":"J","status":"active"},{"id":"MTH-J-04","name":"配置外置与显式化","type":"method","group":"GL-METHOD","stage":"basic","brief":"把随部署环境变化的一切（凭据、资源句柄、每次部署的取值）从代码中严格分离并显式声明，使同一不可变制品能通过注入不同配置部署到任意环境。","layer":"methodology","domain":"J","status":"active"},{"id":"MTH-J-05","name":"渐进暴露部署策略","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"把新版本分阶段、逐步暴露给更大范围的用户与基础设施，而非一次性全量切换；蓝绿以双环境切换、金丝雀以小比例扩量、滚动以实例渐替，均以健康判据驱动推进。","layer":"methodology","domain":"J","cc":["M"],"status":"active"},{"id":"MTH-J-06","name":"发布与部署解耦","type":"method","group":"GL-METHOD","stage":"advanced","brief":"把把制品投入运行环境（部署）与让功能对用户可见（发布）分离，使代码可以先部署而暂不启用，功能的开放由运行时开关独立控制。","layer":"methodology","domain":"J","status":"active"},{"id":"MTH-J-07","name":"可回滚性与爆炸半径控制","type":"method","group":"GL-METHOD","stage":"advanced","brief":"为每次变更预置快速、可靠的恢复能力，并把失败的影响限制在尽可能小的范围：通过制品版本化与路由切换实现快速回滚，通过渐进暴露与故障隔离压缩爆炸半径。","layer":"methodology","domain":"J","cc":["M"],"status":"active"},{"id":"ESS-K-01","name":"可靠性即风险管理","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"服务可靠性不是追求零故障，而是在创新速度与稳定之间对可接受风险做显式管理：把不可靠度视为有限、可预算的资源，据此决定何时发布、何时加固。","layer":"essence","domain":"K","cc":["M"],"status":"active"},{"id":"ESS-K-02","name":"故障不可避免性与容错","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"在足够规模与足够时间的系统中，组件失效、依赖超时与负载突变不可避免；运维的目标不是消除故障，而是在故障存在的前提下维持核心服务、限制影响范围并优雅退化。","layer":"essence","domain":"K","cc":["M"],"status":"active"},{"id":"ESS-K-03","name":"可观测性本质","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"可观测性是仅凭系统对外产生的输出，推断其内部状态、回答未预先设问之问题（未知未知）与「为什么」的能力；它要求系统先具备充分的自我表达，而非事后拼凑。","layer":"essence","domain":"K","cc":["M"],"status":"active"},{"id":"ESS-K-04","name":"度量驱动的反馈闭环","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"运维与可靠性改进必须以可观测的度量形成闭环：用度量暴露现状、驱动决策、验证效果，再据结果校准下一轮行动，使改进成为持续的反馈过程而非一次性工程。","layer":"essence","domain":"K","cc":["M"],"case":["CAS-X-16"],"status":"active"},{"id":"MTH-K-01","name":"服务等级目标方法","type":"method","group":"GL-METHOD","stage":"basic","brief":"用「好事件数 / 总事件数」定义服务水平指标，据此设定低于百分之百的目标值与聚合窗口，并与含后果的协议相区分，把模糊的服务质量转化为可度量、可协商、可决策的目标。","layer":"methodology","domain":"K","cc":["M"],"status":"active"},{"id":"MTH-K-02","name":"错误预算政策与燃尽率告警","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"把允许失败量（100% 减去目标）配套为组织政策，明确预算耗尽时的发布、回滚与加固动作；并以多窗口、多燃尽率组合告警，在预算被快速消耗时及时触发干预。","layer":"methodology","domain":"K","cc":["M"],"status":"active"},{"id":"MTH-K-03","name":"四大黄金信号监控方法","type":"method","group":"GL-METHOD","stage":"basic","brief":"面向用户的系统若只能测量四个指标，就选延迟、流量、错误与饱和度；它们覆盖用户感知的核心维度，并以症状而非原因驱动告警，从而在信息有限时仍能及时发现并定位问题。","layer":"methodology","domain":"K","cc":["M"],"status":"active"},{"id":"MTH-K-04","name":"可观测性信号关联方法","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"用数值聚合、带上下文的事件记录与请求级路径追踪三类信号共同刻画系统，并通过统一的身份与时间基准把它们关联起来；价值在于信号可相互串联以定位根因，而非信号数量或支柱的划分。","layer":"methodology","domain":"K","cc":["M"],"status":"active"},{"id":"MTH-K-05","name":"事件响应与无指责复盘方法","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"以明确的角色分工、活文档与显式交接组织事件响应，尽快缓解影响；事后以无指责复盘聚焦系统性成因、假设参与者基于当时信息善意行事，并把行动项闭环为可验证的改进。","layer":"methodology","domain":"K","cc":["M","N"],"status":"active"},{"id":"MTH-K-06","name":"混沌工程方法","type":"method","group":"GL-METHOD","stage":"advanced","brief":"在生产环境中对系统做受控实验：先定义稳态与假设，再注入真实的动荡变量，比较对照组与实验组的差异以证伪假设，从而主动发现系统性弱点并建立对系统韧性的信心。","layer":"methodology","domain":"K","cc":["M"],"status":"active"},{"id":"MTH-K-07","name":"容量规划与变更管理方法","type":"method","group":"GL-METHOD","stage":"advanced","brief":"以意图驱动的方式编码服务依赖与冗余约束、随需求与供给变化自动重算资源计划；同时把发布变更视为首要故障来源，以渐进暴露、分批与门控降低变更风险并测量其效果。","layer":"methodology","domain":"K","cc":["M"],"status":"active"},{"id":"ESS-L-02","name":"技术债本质","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"技术债是用短期便利换取长期变更成本的设计权衡，其本质是经济取舍而非道德评判：审慎而有意的债务可加速交付，判断标准是债是否审慎、是否被及时偿还，而非是否存在。","layer":"essence","domain":"L","cc":["P"],"status":"active"},{"id":"ESS-L-03","name":"架构侵蚀与漂移","type":"principle","group":"GL-ESSENCE","stage":"advanced","brief":"架构侵蚀是违反既定架构约束的改动导致的系统脆化，架构漂移是对架构不敏感的改动导致的逐渐失一致；两者共同使系统越来越抗拒变更，是架构层腐化的两种机制。","layer":"essence","domain":"L","cc":["P"],"status":"active"},{"id":"ESS-L-04","name":"演化的不可逆性","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"成功投入使用的软件必然持续被修改，且演化在方向上是不可逆的：需求、环境与依赖的变化使系统无法回到先前状态，冻结系统只会加速其价值衰减。","layer":"essence","domain":"L","cc":["P"],"status":"active"},{"id":"ESS-L-05","name":"变更成本随复杂度增长","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"系统复杂度随规模与演化不断增长，使每次变更所需的理解、修改与验证成本持续上升；治理的核心是在演化中抑制这条成本曲线的斜率，而非追求一次性的低复杂度。","layer":"essence","domain":"L","cc":["M","P"],"status":"active"},{"id":"MTH-L-01","name":"行为保持重构","type":"method","group":"GL-METHOD","stage":"basic","brief":"在不改变可观察行为的前提下重组软件内部结构，使其更易理解、更易修改；判定重构是否成立的硬标准是行为不变，治理要点是把小步变换持续进行而非安排一次性大改。","layer":"methodology","domain":"L","cc":["P"],"case":["CAS-X-04"],"status":"active"},{"id":"MTH-L-02","name":"代码坏味道启发式","type":"method","group":"GL-METHOD","stage":"basic","brief":"把代码中易于察觉的表层迹象作为可能指向更深层结构问题的启发式信号，用以发现重构对象与时机；坏味道提示「值得检查」，但不等于「一定有问题」，不能机械照改。","layer":"methodology","domain":"L","cc":["P"],"status":"active"},{"id":"MTH-L-03","name":"技术债象限与偿还策略","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"以「有意/无意」与「审慎/鲁莽」两组正交判据对债务分诊，据此制定差异化偿还策略：审慎有意者计划偿还，审慎无意者随认知更新修正，鲁莽者立即纠正，并按变更热点优先偿付利息最高的债务。","layer":"methodology","domain":"L","cc":["P"],"status":"active"},{"id":"MTH-L-04","name":"演进式架构","type":"method","group":"GL-METHOD","stage":"advanced","brief":"把「有引导的增量变更」确立为跨多个架构维度的首要原则：通过定义架构维度、以可执行机制持续校验合规，并用增量交付验证，使架构能在不失去完整性的前提下持续演化。","layer":"methodology","domain":"L","cc":["M"],"status":"active"},{"id":"MTH-L-05","name":"架构适应度函数","type":"method","group":"GL-METHOD","stage":"advanced","brief":"对某些架构特性提供客观完整性评估的可执行机制：把架构意图转写为可判定、可量化的校验，在构建或运行时持续验证，使架构约束不依赖人的记忆与自觉，从而抑制架构漂移。","layer":"methodology","domain":"L","cc":["M"],"case":["CAS-X-06","CAS-X-07"],"status":"active"},{"id":"MTH-L-06","name":"遗留系统渐进治理","type":"method","group":"GL-METHOD","stage":"advanced","brief":"对难以安全修改的遗留系统，先以接缝与特征测试建立覆盖既有行为的安全网，再以绞杀者方式增量迁移新功能、逐步替代旧系统，避免缺乏保护的大规模重写。","layer":"methodology","domain":"L","cc":["P"],"status":"active"},{"id":"MTH-L-07","name":"弃用与日落策略","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"对将被淘汰的能力采取分级的退场流程：先发出弃用信号并提供替代与迁移路径，留足通知期，再按版本语义区分兼容的弃用与破坏性的移除，从而在收敛接口的同时不破坏既有依赖。","layer":"methodology","domain":"L","cc":["P"],"status":"active"},{"id":"ESS-M-01","name":"可维护性本质","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"可维护性是产品被修改以改进、纠错或适应环境与需求变化的有效性与效率程度；它是一种关于变更经济性的质量，衡量的是未来修改的代价，而非某个静态结构特征。","layer":"essence","domain":"M","cc":["M"],"status":"active"},{"id":"ESS-M-02","name":"可演化性与可扩展性","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"可演化性指系统在生命周期内以尽可能低代价容纳需求与环境变化、同时保持架构完整性的能力；可扩展性指通过架构预置的扩展点、以已知且有计划的方式扩展功能或质量特性的能力。","layer":"essence","domain":"M","cc":["M"],"status":"active"},{"id":"ESS-M-03","name":"性能效率本质","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"性能效率是产品在特定条件下按指定时间与吞吐参数完成功能、并高效利用处理资源（处理器、内存、存储、网络、能源等）的程度，由时间行为、资源利用与容量三方面共同刻画。","layer":"essence","domain":"M","cc":["M"],"status":"active"},{"id":"ESS-M-04","name":"可靠性与可用性","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"可靠性是系统在特定条件下于指定时间段内执行规定功能的程度，其子特性含无故障性、可用性、容错性与可恢复性；可用性是可被正常使用的时间比例，反映系统对外服务不中断的能力。","layer":"essence","domain":"M","cc":["M"],"status":"active"},{"id":"ESS-M-05","name":"质量属性不可直接测量","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"质量属性是功能之外、可独立选择期望水平的维度，但它们不可被直接测量；只有把属性转写为含刺激源、刺激、环境、制品、响应与响应度量的具体场景，才能得到可验证、可判定的需求。","layer":"essence","domain":"M","cc":["M"],"status":"active"},{"id":"MTH-M-01","name":"质量属性战术映射方法","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"把每项质量属性目标映射到一组可组合的架构战术（影响该属性响应控制的设计决策），再由战术组合成架构策略、打包为模式，使抽象的质量目标转化为具体、可评审的设计动作的方法。","layer":"methodology","domain":"M","cc":["M"],"status":"active"},{"id":"MTH-M-02","name":"可修改性战术应用","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"以耦合、内聚与成本动因为依据应用可修改性战术：通过推迟绑定时间、局部化变更与防止涟漪效应，使修改集中在局部、减小受影响模块数与回归风险，从而降低变更成本。","layer":"methodology","domain":"M","cc":["M"],"status":"active"},{"id":"MTH-M-03","name":"可用性战术应用","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"以故障检测、故障恢复与故障预防三类战术构建可用性：检测使失效尽早被发现，恢复使系统在部分失效后继续服务，预防降低失效概率或限制其影响，三者配合把故障限制在局部。","layer":"methodology","domain":"M","cc":["M"],"status":"active"},{"id":"MTH-M-04","name":"质量模型应用方法","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"以标准化的质量模型（由质量特性与子特性构成的框架）为共同参照，把分散的质量关切组织为可规定、可测量、可评价的维度，并据此在需求、设计与评价之间建立一致的映射。","layer":"methodology","domain":"M","cc":["M"],"status":"active"},{"id":"MTH-M-05","name":"可维护性评估方法","type":"method","group":"GL-METHOD","stage":"advanced","brief":"沿可维护性的子特性组织证据，结合结构度量、变更历史与维护过程指标，对系统「修改得有多有效、多高效」做出可比较判断，并据此定位需优先治理的结构问题。","layer":"methodology","domain":"M","cc":["M"],"status":"active"},{"id":"MTH-M-06","name":"质量属性权衡决策方法","type":"method","group":"GL-METHOD","stage":"advanced","brief":"面对相互牵制的质量属性，先以场景明确各属性目标与可接受边界，再识别同时影响多个属性的权衡点，通过显式比较与优先级排序做出可解释、可复核、可撤销的决策。","layer":"methodology","domain":"M","cc":["M"],"status":"active"},{"id":"ESS-N-02","name":"组织-架构同态","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"组织沟通结构与其所设计系统的架构之间存在保结构的同态关系：沟通密集处趋于高内聚，沟通稀疏处趋于系统边界；若每个子系统各有独立设计组，两种结构几乎完全一致。","layer":"essence","domain":"N","cc":["N"],"status":"active"},{"id":"ESS-N-03","name":"团队边界与架构边界耦合","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"团队边界与系统架构边界相互耦合：团队负责范围若与模块边界错位，跨边界协调成本会以接口复杂度、交接与返工的形式转嫁到系统上，二者需同步演化。","layer":"essence","domain":"N","cc":["N"],"status":"active"},{"id":"ESS-N-04","name":"认知负荷约束","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"团队能承载的复杂度有限，每一个新增的工具、职责或领域都消耗其心智带宽；认知负荷因此是划分团队与架构时必须显式考虑的约束，而非可忽略的软因素。","layer":"essence","domain":"N","cc":["N"],"status":"active"},{"id":"ESS-N-05","name":"组织即设计系统","type":"principle","group":"GL-ESSENCE","stage":"advanced","brief":"承担系统设计的组织本身也是一个需要被设计的系统：其结构、边界、沟通与激励机制共同决定它能产出什么样的架构，因此组织设计应被视为技术设计的组成部分。","layer":"essence","domain":"N","cc":["N"],"status":"active"},{"id":"MTH-N-01","name":"逆向康威操作","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"主动演进团队与组织结构，使其沟通结构对应期望的软件架构，从而让目标架构在组织沟通结构的塑形作用下自然生长，而非在既有组织形态下被扭曲。","layer":"methodology","domain":"N","cc":["N"],"status":"active"},{"id":"MTH-N-02","name":"团队拓扑四类型","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"把团队设计约束为四种基本形态——对齐价值流的团队、教练赋能团队、复杂子系统团队与平台团队——借成熟模式引导快速流动，同时以有限类型抑制组织设计的随意性。","layer":"methodology","domain":"N","cc":["N"],"status":"active"},{"id":"MTH-N-03","name":"团队交互模式","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"显式定义团队之间的交互方式——限时高带宽协作、清晰边界的服务消费、以及教练式促进——以消除含糊的协调要求，使团队边界的成本与收益可被管理。","layer":"methodology","domain":"N","cc":["N"],"status":"active"},{"id":"MTH-N-04","name":"平台团队与最薄可行平台","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"以产品方式建设平台团队，把通用能力封装为可自助使用的内部产品，以降低流对齐团队的认知负荷、加速交付；并以最薄可行平台约束平台规模，避免臃肿平台制造新依赖。","layer":"methodology","domain":"N","cc":["N"],"status":"active"},{"id":"MTH-N-05","name":"DORA 交付效能指标","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"以一组经过实证的软件交付效能指标——吞吐侧的变更前置时间、部署频率、失败部署恢复时间，与不稳定侧的变更失败率、部署返工率——衡量组织把变更交付到生产的效能，并用于改进而非考核。","layer":"methodology","domain":"N","cc":["N"],"status":"active"},{"id":"MTH-N-06","name":"团队边界治理","type":"method","group":"GL-METHOD","stage":"advanced","brief":"把团队边界视为需要持续校准的活对象：以价值流、所有权、认知负荷与交付信号为依据，周期性评估并调整边界与交互方式，防止边界随组织惯性僵化或频繁漂移。","layer":"methodology","domain":"N","cc":["N"],"status":"active"},{"id":"ESS-O-03","name":"权衡的不可消除性","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"任何设计都在有限资源与相互牵制的目标之间做选择，优化一个维度通常以牺牲另一个为代价；权衡不能被消除，只能被显式化、迁移，或在具体语境下选出更合适的落点。","layer":"essence","domain":"O","cc":["M","X"],"case":["CAS-X-04"],"status":"active"},{"id":"MTH-O-01","name":"覆盖与精度的不对称权衡","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"在同一活动中，高覆盖（宁多勿漏）与高精度（宁缺毋滥）此消彼长；因漏失常不可补救而噪声多可过滤，代价不对称，故默认偏向覆盖，再以分层门控逐级精筛。","layer":"methodology","domain":"O","cc":["M"],"status":"active"},{"id":"MTH-O-02","name":"准入与触发时机选择","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"决定何时、由谁把产物推进下一环节：人工门控可控但易漏、自动流转高效但可能放行半成品，应在「可信度门槛与发生频率」两个维度上选择人工、自动或半自动策略。","layer":"methodology","domain":"O","cc":["X"],"case":["CAS-X-14"],"status":"active"},{"id":"MTH-O-03","name":"技术选型的够用原则","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"在标准、框架、架构风格与组件间选型时，应按适用域与约束匹配需求，选择刚好满足质量属性场景的方案；任何额外能力都伴随新的复杂度，能用简单方案解决就不上复杂方案。","layer":"methodology","domain":"O","cc":["X"],"case":["CAS-X-02","CAS-X-12"],"status":"active"},{"id":"MTH-O-04","name":"能力-成本-速度三角","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"在能力/质量、成本与交付速度之间取舍时，须区分一次性成本与持续成本，先量化各方案的人力、基础设施与运维开销；研究表明速度与稳定可兼得，成本优化的重点应是持续成本与减小变更批量。","layer":"methodology","domain":"O","cc":["X"],"case":["CAS-X-12"],"status":"active"},{"id":"MTH-O-05","name":"质量属性冲突治理","type":"method","group":"GL-METHOD","stage":"advanced","brief":"质量属性之间此消彼长（如性能与可修改性、安全与性能、可靠性与成本），治理方法是在场景层面显式化敏感点与权衡点，用可度量判据排序取舍并写入决策记录，而非追求所有属性同时最优。","layer":"methodology","domain":"O","cc":["M"],"case":["CAS-X-16"],"status":"active"},{"id":"MTH-O-06","name":"粒度与边界设定","type":"method","group":"GL-METHOD","stage":"advanced","brief":"决定模块、服务、知识域与团队按什么分解、切到多细：应围绕可能变化的设计决策（信息隐藏）而非处理步骤切分，用内聚耦合度量与认知负荷约束边界，并使架构边界与团队边界同步演化。","layer":"methodology","domain":"O","cc":["N","X"],"case":["CAS-X-08","CAS-X-10","CAS-X-18"],"status":"active"},{"id":"MTH-O-07","name":"自动化方式选择","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"在规则/模板、模型生成与纯人工之间选择实现方式：模板与规则零成本且可控，模型与自动化适合高频或复杂场景；应按沉淀粒度与可信度门槛选择，并为自动化配置持续执行与反馈闭环。","layer":"methodology","domain":"O","cc":["X"],"case":["CAS-X-17","CAS-X-18"],"status":"active"},{"id":"MTH-O-08","name":"复杂度阶梯与演进时机","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"在简单与复杂方案之间选择与进阶时机：复杂方案的建设、延迟与一致性成本更高，应先跑通最简单可工作的方案，待出现明确且当前的跨域或规模需求时再逐步演进，而非为预想的未来提前复杂化。","layer":"methodology","domain":"O","cc":["X"],"status":"active"},{"id":"MTH-O-09","name":"理解成本优先的简单原则","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"在功能丰富与简单透明之间选择时，应把理解成本视为真实成本：每个组件都要能说清「为何在、故障怎么查」，文档按干系人关注点裁剪，平台保持最薄可行，避免不可理解的黑盒。","layer":"methodology","domain":"O","cc":["M","N"],"status":"active"},{"id":"MTH-O-10","name":"增量演化与一致性治理","type":"method","group":"GL-METHOD","stage":"advanced","brief":"在演化中治理一致性：优先用增量同步、契约与弃用信号替代全量重建，用适应度函数持续防止架构漂移，并以 expand/contract、绞杀者等模式渐进迁移，使变更小批量、可回退。","layer":"methodology","domain":"O","cc":["P","X"],"case":["CAS-X-06","CAS-X-07","CAS-X-14"],"status":"active"},{"id":"MTH-O-11","name":"度量与反馈闭环","type":"method","group":"GL-METHOD","stage":"advanced","brief":"建立轻量、客观、可复现的评估体系与反馈闭环：用真实场景与基线度量、以多指标协同避免单点失真，并把度量接入持续执行与复测；同时警惕古德哈特定律，防止指标一旦成为目标即被博弈。","layer":"methodology","domain":"O","cc":["M","N"],"case":["CAS-X-16","CAS-X-17"],"status":"active"},{"id":"ESS-G-07","name":"架构描述与对应关系","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"架构本身是不可见的抽象，表达架构的工件称为架构描述（AD）。AD 由描述元素、模型种类与对应关系构成，并以对应的强制规则约束视图内部及视图之间的一致性、可追溯与组合，使多份面向不同关注点的局部表达汇成对同一架构的统一、可校验的整体。","layer":"essence","domain":"G","case":["CAS-X-09"],"status":"active"},{"id":"MTH-G-05","name":"架构文档化方法","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"以「文档化相关视图，再文档化适用于多个视图的信息」为组织原则的架构文档化方法：先按预期用途与干系人关注选择视图，再表达每个视图的「如何组织、架构是什么、为何如此」，并以跨视图信息与一致性校验避免文档过载与失真。","layer":"methodology","domain":"G","cc":["M"],"case":["CAS-X-01","CAS-X-09","CAS-X-10","CAS-X-13","CAS-X-15"],"status":"active"},{"id":"MTH-G-06","name":"效用树与敏感点权衡点分析","type":"method","group":"GL-METHOD","stage":"advanced","brief":"把质量属性自顶向下细化为带刺激与响应度量的场景并排序的效用树构造技法，以及在架构方法上识别敏感点、权衡点并归纳风险主题的分析技法：它把笼统的质量目标变成可探测、可排序、可聚焦的风险清单。","layer":"methodology","domain":"G","cc":["M"],"status":"active"},{"id":"ESS-H-08","name":"SOLID 职责划分与替换性","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"SOLID 是一组以职责划分与可替换性为判据的面向对象设计原则族：单一职责约束变更原因，开闭原则要求以扩展而非修改应对变化，里氏替换与接口隔离约束子类型与接口依赖，依赖倒置约束依赖方向。","layer":"essence","domain":"H","cc":["M"],"status":"active"},{"id":"ESS-H-09","name":"设计模式与反模式","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"设计模式是对反复出现的设计问题所给的可复用解法模板，提供团队共同语言但不保证适用；反模式是初看合理却适得其反的常见解法，二者把设计经验的正反两面固化为可传承的知识。","layer":"essence","domain":"H","cc":["M","P"],"status":"active"},{"id":"MTH-H-03","name":"战略式编程与持续设计投入","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"一种把系统设计视为贯穿开发全过程的持续投入、而非开工前一次性阶段的编程纪律：以持续、小步的设计改进对抗复杂度的累积，使系统长期保持易于理解与修改。","layer":"methodology","domain":"H","cc":["P"],"status":"active"},{"id":"MTH-H-04","name":"代码复审与可读性治理","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"以评审流程把可读性与结构标准组织化、可教学地传播的治理方法：把代码评审从个人偏好检查转为有依据、有导师机制的常规活动，在变更合入前对结构、接口与可读性施加统一约束。","layer":"methodology","domain":"H","cc":["N","M"],"case":["CAS-X-15"],"status":"active"},{"id":"CAS-X-01","name":"去中心化聊天架构逆向","type":"case","group":"GC-CASE","stage":"intermediate","brief":"对一个仅有 58 份设计文档、尚未实现的开源去中心化聊天项目做架构逆向：从设计文本提炼 18 个模块及其依赖关系，重建模块依赖 DAG 与三条核心数据流 DAG，并输出全景理解与深度需求分析。","domain":"X","cc":["X"],"status":"active"},{"id":"CAS-X-02","name":"网申填写扩展逆向架构","type":"case","group":"GC-CASE","stage":"intermediate","brief":"对 Chrome MV3 网申自动填写扩展的逆向架构分析：梳理 popup、content、background、options 四模块职责，解剖 12 个站点适配器、双通道消息协议与隐私脱敏机制，并评估其零依赖零构建选型。","domain":"X","cc":["M"],"status":"active"},{"id":"CAS-X-03","name":"网申 v3 多模块解耦","type":"case","group":"GC-CASE","stage":"intermediate","brief":"一套面向高可扩展性的网申信息速查扩展架构：以 schema.js 为唯一数据驱动源，把数据模型、存储、纯函数与渲染组织为严格单向依赖的共享层，供 popup 与页面浮层双容器复用，并先立跨模块接口契约。","domain":"X","cc":["M"],"status":"active"},{"id":"CAS-X-04","name":"网申 v2 深度重构","type":"case","group":"GC-CASE","stage":"advanced","brief":"一次由「改一处漏多处」症状触发的深度重构：定位到接口定义散落 12 个文件、存在 7 种接口形态的根因后，以单一契约源、dispatch 消息表与能力注册中心重建三层契约系统，恢复可审计与可校验性。","domain":"X","cc":["P"],"status":"active"},{"id":"CAS-X-05","name":"preset 通道耦合分析","type":"case","group":"GC-CASE","stage":"advanced","brief":"对 harness「委派工具层→续用管理器→preset 服务→MCP 服务器」这条通道做耦合分析：识别契约、服务定位、数据契约、组合语义、路径与装配一致性六类耦合点，定位「静默丢弃特化」与「装配漂移」两处实质缝隙。","domain":"X","cc":["M","P"],"status":"active"},{"id":"CAS-X-06","name":"插件 DAG RC5→RC7 升级","type":"case","group":"GC-CASE","stage":"advanced","brief":"一次知识库随上游源码版本升级的级联维护：以三层差异分析把 219 个包收敛为 26 个实质变更包，经编译、运行时、组合三类依赖判定更新 DAG 数据后全量重生成页面，并以静态门控加渲染验证收口。","domain":"X","cc":["P"],"status":"active"},{"id":"CAS-X-07","name":"插件 DAG 两次级联升级","type":"case","group":"GC-CASE","stage":"advanced","brief":"在同一知识库上继续两轮上游级联升级：处理数百次提交与包的增删，暴露「依赖声明不等于运行时引用」、分层须按最长路径深度、纯外部依赖边不得入主图等差分陷阱，并以全量门控校验收口。","domain":"X","cc":["P"],"status":"active"},{"id":"CAS-X-08","name":"dsh-manager 插件深度分析","type":"case","group":"GC-CASE","stage":"advanced","brief":"以「编译依赖、运行时注入、组合装配」三硬依据加源码行号，对第三方插件做依赖、功能、需求溯源与设计问题裁决，并复用上游 DAG 知识库节点标识，使分析结果可与主图互查。","domain":"X","cc":["M","P"],"status":"active"},{"id":"CAS-X-09","name":"harness 源码架构解析","type":"case","group":"GC-CASE","stage":"advanced","brief":"对 deepseek-harness 官方源码做分层解析：镜像官方架构文档，按九个层与九十余模块建立文档集群，产出跨层联动矩阵与七条关键路径，并钉住「模型可见即已记录」、能力缝三角等设计不变量。","domain":"X","cc":["X"],"status":"active"},{"id":"CAS-X-10","name":"dsh 插件依赖增量定位","type":"case","group":"GC-CASE","stage":"intermediate","brief":"以官方插件 DAG 为蓝本，对一个官方清单之外的全新社区插件做功能定位与依赖位置增量分析，产出可下钻交互依赖图与多形态文档的源码级架构逆向案例。","domain":"X","cc":["M","P"],"status":"active"},{"id":"CAS-X-11","name":"Hermes 七层架构总览","type":"case","group":"GC-CASE","stage":"advanced","brief":"对八千余文件的工业级 AI Agent 项目做七层架构总览逆向，揭示其「越用越聪明」的自进化闭环如何在层间传导的控制型架构案例。","domain":"X","cc":["M","N"],"status":"active"},{"id":"CAS-X-12","name":"MCP 四件套选型对比","type":"case","group":"GC-CASE","stage":"intermediate","brief":"对四个同类 MCP 服务器做源码级能力与成本对比，并以常驻 token 预算为轴给出分级接入策略的技术选型实战案例。","domain":"X","cc":["M","P"],"status":"active"},{"id":"CAS-X-13","name":"Claude Code 架构逆向","type":"case","group":"GC-CASE","stage":"advanced","brief":"以社区逆向源码、系统提示词与官方文档三源交叉验证，还原一个商业 Agent 的查询引擎、子Agent、工具与权限体系的逆向分析案例。","domain":"X","cc":["M","N"],"status":"active"},{"id":"CAS-X-14","name":"OpenSpec 规约驱动解析","type":"case","group":"GC-CASE","stage":"intermediate","brief":"对比规约驱动开发工具链 OpenSpec 与 Superpower 的元模型、工件依赖 DAG 与安全门控，提炼「规约先于实现」工程形态的解析案例。","domain":"X","cc":["M","P"],"status":"active"},{"id":"CAS-X-15","name":"Open Code Review 图谱","type":"case","group":"GC-CASE","stage":"advanced","brief":"对阿里开源 AI 代码审查 CLI 做源码级解析并构建「知识 + 实践资产 + AI 索引」三合一知识图谱的工程案例。","domain":"X","cc":["M","P"],"status":"active"},{"id":"CAS-X-16","name":"控制理论⊗Agent 设计","type":"case","group":"GC-CASE","stage":"advanced","brief":"将控制理论五维（负反馈 / 状态估计 / PID / 鲁棒 / 分层）系统映射到 Agent 工程环节，并以真实产品案例验证的跨学科方法论案例。","domain":"X","cc":["M","P"],"status":"active"},{"id":"CAS-X-17","name":"技术知识中枢交付法","type":"case","group":"GC-CASE","stage":"advanced","brief":"从模糊需求到上线，把 AI Agent 驱动的端到端交付固化为四阶段加双共识加迭代的可迁移方法论的实战提炼案例。","domain":"X","cc":["M","N"],"status":"active"},{"id":"CAS-X-18","name":"AI Agent 架构 DAG 复盘","type":"case","group":"GC-CASE","stage":"intermediate","brief":"对四个工作日内独立完成三个异构对象 DAG 分析的方法论复盘，总结「采集→建模→生成→门控→交付」可复用管线与关键教训。","domain":"X","cc":["M","N"],"status":"active"},{"id":"TEC-F-01","name":"需求可追溯性与影响分析","type":"technology","group":"GL-TECHNOLOGY","stage":"intermediate","brief":"以需求库为中枢，把需求条目、属性与上下游制品（干系人需求、系统需求、设计、测试、代码）建立可查询的追踪关系，并以结构化查询支持变更影响分析的需求管理平台化落地。","layer":"technology","domain":"F","cc":["M"],"case":["CAS-X-14"],"status":"active"},{"id":"TEC-F-02","name":"需求技术债识别与度量","type":"technology","group":"GL-TECHNOLOGY","stage":"advanced","brief":"识别并度量需求技术债——理想规格与实际实现之间的差距——的技术做法，把需求层的债务纳入技术债管理（TDM）的识别与度量阶段，使需求质量缺口可被发现与跟踪。","layer":"technology","domain":"F","cc":["P"],"case":["CAS-X-01"],"status":"active"},{"id":"TEC-N-01","name":"交付效能度量与仪表化","type":"technology","group":"GL-TECHNOLOGY","stage":"intermediate","brief":"把交付效能指标的采集、聚合与呈现平台化：从版本控制与流水线事件自动计算并持续反馈，并以治理机制约束指标被博弈（gaming）的风险，使度量服务于改进而非考核。","layer":"technology","domain":"N","cc":["N"],"status":"active"},{"id":"TEC-N-02","name":"团队拓扑落地与规模化","type":"technology","group":"GL-TECHNOLOGY","stage":"advanced","brief":"在规模化组织中落地团队拓扑四类型与三交互模式，以认知负荷管理与快速流动为约束、显式定义团队交互方式的组织实践，用于把团队结构与被期望的架构对齐。","layer":"technology","domain":"N","cc" ,"brief":"部署自动化把从构建产物到各环境的部署过程脚本化、参数化并纳入版本控制，使任何持有凭据者都能把任意已构建制品一致地部署到任意环境，且过程尽量幂等、可重复。","layer":"technology","domain":"J","cc":["N"],"status":"active"},{"id":"TEC-J-06","name":"部署流水线工具化","type":"technology","group":"GL-TECHNOLOGY","stage":"basic","brief":"部署流水线把从提交到生产的构建过程拆分为多个置信度递增的自动化阶段，前一阶段产出的制品供后续阶段逐级晋级，生产部署通常是流水线的最后一个阶段。","layer":"technology","domain":"J","cc":["M","N"],"case":["CAS-X-18"],"status":"active"},{"id":"TEC-K-01","name":"断路器与重试退避","type":"technology","group":"GL-TECHNOLOGY","stage":"intermediate","brief":"断路器、超时与重试是一组协同的远程调用稳定性实现：超时限制等待，断路器在失败达阈值后快速失败以阻止级联，重试仅针对幂等操作的瞬时故障并以指数退避加抖动控制节奏。","layer":"technology","domain":"K","cc":["M"],"case":["CAS-X-05"],"status":"active"},{"id":"TEC-K-02","name":"可观测性信号采集","type":"technology","group":"GL-TECHNOLOGY","stage":"intermediate","brief":"通过 traces、metrics、logs 等信号从系统外部推断内部状态，以回答未知未知与为何发生；工程界习称三支柱，其价值关键在于信号可关联而非数量多少。","layer":"technology","domain":"K","cc":["M"],"case":["CAS-X-09"],"status":"active"},{"id":"TEC-K-03","name":"服务等级目标与错误预算","type":"technology","group":"GL-TECHNOLOGY","stage":"advanced","brief":"用 SLI（好事件/总事件）度量服务水平，设定小于 100% 的 SLO 目标，并以错误预算等于 100% 减 SLO 驱动发布与加固决策；SLA 则是含后果的对外契约。","layer":"technology","domain":"K","cc":["M","N"],"status":"active"},{"id":"TEC-K-04","name":"混沌工程实践","type":"technology","group":"GL-TECHNOLOGY","stage":"advanced","brief":"在生产中对系统做受控实验以建立对其抵御动荡条件能力的信心：定义稳态、提出假设、注入真实事件、比较对照组与实验组以证伪，并最小化爆炸半径。","layer":"technology","domain":"K","cc":["M"],"status":"active"},{"id":"TEC-K-05","name":"无指责复盘实践","type":"technology","group":"GL-TECHNOLOGY","stage":"intermediate","brief":"事故发生后的书面复盘，记录影响、缓解、根因与行动项，其文化内核是聚焦导致事件的系统性原因与当时决策情境，而非追责任何个人或团队。","layer":"technology","domain":"K","cc":["M","N"],"status":"active"},{"id":"TEC-K-06","name":"DORA 交付指标","type":"technology","group":"GL-TECHNOLOGY","stage":"basic","brief":"用一组软件交付效能指标衡量组织的交付吞吐与稳定性；当前官方口径为五项指标，由早期四键扩展而来，并已用失败部署恢复时间取代平均修复时间。","layer":"technology","domain":"K","cc":["N","M"],"status":"active"},{"id":"TEC-L-01","name":"架构适应度函数工具化","type":"technology","group":"GL-TECHNOLOGY","stage":"advanced","brief":"把架构约束与质量目标转写为可自动执行、可量化判定的校验，并借助测试、静态分析、监控与部署流水线门禁等机制持续运行，使架构意图不再依赖人的记忆与自觉。","layer":"technology","domain":"L","cc":["M"],"case":["CAS-X-06","CAS-X-15","CAS-X-18"],"status":"active"},{"id":"TEC-L-02","name":"绞杀者渐进式替换","type":"technology","group":"GL-TECHNOLOGY","stage":"advanced","brief":"在遗留系统之上或之旁增量构建新实现，通过可切换的接缝与路由逐步把功能与数据迁移过去，逐步替代旧系统，而非一次性整机重写。","layer":"technology","domain":"L","cc":["P"],"status":"active"},{"id":"TEC-M-01","name":"质量模型工具化","type":"technology","group":"GL-TECHNOLOGY","stage":"intermediate","brief":"把 SQuaRE 系列标准的质量特性与子特性框架落为可操作的检查表、需求模板与评价工具，使质量关切在需求、设计与评价之间以同一坐标被规定、测量与比较。","layer":"technology","domain":"M","cc":["M"],"status":"active"},{"id":"TEC-M-02","name":"可维护性量化","type":"technology","group":"GL-TECHNOLOGY","stage":"advanced","brief":"把可维护性与技术债转写为可计算指标：以修复违规的成本估计债务本金、按对可维护性的影响折算利息，沿质量子特性组织规则与评分，使变更成本可比较、可追踪。","layer":"technology","domain":"M","cc":["M","P"],"status":"active"},{"id":"TEC-M-03","name":"可修改性战术实现","type":"technology","group":"GL-TECHNOLOGY","stage":"intermediate","brief":"把推迟绑定时间、局部化变更与防止涟漪效应三类设计决策落到具体结构机制（接口与间接层、易变决策封装、依赖方向约束与依赖反转），以缩小每次修改的影响半径。","layer":"technology","domain":"M","cc":["M"],"case":["CAS-X-02","CAS-X-03","CAS-X-04","CAS-X-05"],"status":"active"},{"id":"ESS-G-04","name":"模块化与分解","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"把系统划分为边界清晰、可独立理解、可测试并可独立变更的模块。模块化的收益不取决于是否划分或划分了多少模块，而取决于划分所依据的判据——是按容易变化的设计决策切分，还是按执行步骤切分。","layer":"essence","domain":"G","cc":["M"],"case":["CAS-X-03","CAS-X-11"],"status":"active"},{"id":"ESS-G-05","name":"架构风格","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"定义一类系统结构组织方式的模式：规定该系统实例中可用的组件与连接件词汇表，以及它们的组合约束，从而约束设计空间并带来一组可预期的属性。","layer":"essence","domain":"G","cc":["M"],"case":["CAS-X-02","CAS-X-11"],"status":"active"},{"id":"ESS-G-06","name":"视图与视角","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"按不同干系人的关注点，从特定角度表达系统架构的概念结构；视角是一类视图的构造与解释约定，视图则是按某个视角约定所作的具体表达。","layer":"essence","domain":"G","case":["CAS-X-09"],"status":"active"},{"id":"ESS-H-05","name":"深模块与浅模块","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"以“接口复杂度与所提供功能之比”评价模块的两种形态：深模块提供强大功能却只有简单接口，浅模块接口相对复杂却功能不足，未能隐藏显著复杂度。","layer":"essence","domain":"H","case":["CAS-X-11"],"status":"active"},{"id":"ESS-H-06","name":"组合优于继承与脆弱基类","type":"principle","group":"GL-ESSENCE","stage":"intermediate","brief":"在复用与扩展中优先采用对象组合而非类继承：继承以暴露父类实现为代价换取复用，组合只依赖被复用对象的接口，从而维持封装边界与替换能力。","layer":"essence","domain":"H","status":"active"},{"id":"ESS-H-07","name":"可读性与认知负荷","type":"principle","group":"GL-ESSENCE","stage":"basic","brief":"把代码可读性视为一种工程要求：代码被阅读的次数远多于被编写，理解与修改代码的成本由读者所需的认知负荷决定，而非由风格偏好决定。","layer":"essence","domain":"H","status":"active"},{"id":"MTH-G-01","name":"架构决策记录","type":"method","group":"GL-METHOD","stage":"basic","brief":"把每个架构上重要的决策记录为短文本文件（含上下文、决策、状态与后果），使决策依据、取舍与被否决的备选可被追溯、复核与取代，而非散落在会议记录与个人记忆中。","layer":"methodology","domain":"G","cc":["M"],"status":"active"},{"id":"MTH-G-02","name":"质量属性场景与ATAM","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"先用六要素场景把质量属性转成可验证需求，再以 ATAM 的九步流程把场景映射到架构决策，输出风险、非风险、敏感点与权衡点并归纳为风险主题的架构评估方法。","layer":"methodology","domain":"G","cc":["M"],"status":"active"},{"id":"MTH-G-03","name":"架构风格选择方法","type":"method","group":"GL-METHOD","stage":"advanced","brief":"以质量属性场景为判据，把候选架构风格（分层、管道-过滤器、事件驱动、微服务等）的组件-连接件约束映射到属性收益与代价，在具体子域上择优而非追求普适最优的选型方法。","layer":"methodology","domain":"G","cc":["M"],"status":"active"},{"id":"MTH-G-04","name":"领域驱动战略设计","type":"method","group":"GL-METHOD","stage":"advanced","brief":"以限界上下文显式划定模型适用边界、以通用语言在单个上下文内统一团队与代码的表达，并通过上下文映射管理跨上下文关系的领域建模战略方法。","layer":"methodology","domain":"G","cc":["N"],"status":"active"},{"id":"MTH-H-01","name":"重构手法族","type":"method","group":"GL-METHOD","stage":"intermediate","brief":"在不改变可观察行为的前提下，按命名的小步手法持续改善代码内部结构的方法族；以代码坏味道为信号、以测试为安全网，把结构调整为可验证的小步而非大重写。","layer":"methodology","domain":"H","cc":["P"],"status":"active"},{"id":"MTH-H-02","name":"信息隐藏模 ":"ESS-G-04","viaTo":"ESS-H-01","type":"prerequisite"},{"source":"GD-G","target":"GCC-M","viaFrom":"ESS-G-01","viaTo":"ESS-G-05","type":"prerequisite"}],"groupColor":{"GL-ESSENCE":"#4f8cff","GL-METHOD":"#4f8cff","GL-TECHNOLOGY":"#4f8cff","GD-F":"#5ad0d0","GD-G":"#5ad0d0","GD-H":"#5ad0d0","GD-I":"#5ad0d0","GD-J":"#5ad0d0","GD-K":"#5ad0d0","GD-L":"#5ad0d0","GD-M":"#5ad0d0","GD-N":"#5ad0d0","GD-O":"#5ad0d0","GD-X":"#5ad0d0","GCC-M":"#b48ae0","GCC-P":"#b48ae0","GCC-N":"#b48ae0","GC-CASE":"#e05563"},"stageColor":{"basic":"#4f8cff","intermediate":"#2fb98a","advanced":"#e8933b"},"edgeColor":{"prerequisite":"#4f8cff","dependency":"#e8933b","derives_from":"#b48ae0","refines":"#4f8cff","implements":"#2fb98a","case_instance":"#e05563","cross_reference":"#5ad0d0","supersedes":"#e0c35e","deprecated_by":"#3a3f4a","mitigates":"#2fb98a","contrasts":"#e05563","conflicts":"#e05563","enables":"#5ad0d0","variant":"#e0c35e","combination":"#b48ae0","cooccurrence":"#5ad0d0"}};
  const EDGE_COLOR = DATA.edgeColor;
  const STAGE_COLOR = DATA.stageColor;
  const EDGE_LABEL = {"prerequisite": "前置依赖", "dependency": "依赖关联", "derives_from": "依据推导", "refines": "细化", "implements": "实现", "case_instance": "案例印证", "cross_reference": "跨体系对照", "supersedes": "取代", "deprecated_by": "被弃用", "mitigates": "缓解治理", "contrasts": "对照", "conflicts": "张力冲突", "enables": "促成", "variant": "变体", "combination": "组合", "cooccurrence": "共现"};
  const nodeById = {}; DATA.nodes.forEach(n => nodeById[n.id] = n);
  const groupById = {}; DATA.groups.forEach(g => groupById[g.id] = g);
  const nodeToGroup = {}; DATA.groups.forEach(g => g.node_ids.forEach(nid => nodeToGroup[nid] = g.id));
  const groupNodeIndex = {}; DATA.groups.forEach(g => g.node_ids.forEach((nid,i) => { groupNodeIndex[nid] = i; }));
  let currentGroup = null, bridgeMode = false;

  const $ = id => document.getElementById(id);
  const crumb = $('crumb');
  function isBridge(nid){ const n = nodeById[nid]; return n && (n.type === 'bridge' || n.src === 'bridge'); }

  function buildGroupNodes(){
    const nodes = DATA.groups.map(g => ({ data:{ id:'grp-'+g.id, label:g.name, kind:'group', group:g.id, gname:g.name, domain:g.domain, gkind:g.kind, totalCount:g.node_ids.length } }));
    const edges = []; const seen = new Set();
    DATA.groupEdges.forEach(ge => {
      const k = ge.source+'|'+ge.target;
      if (seen.has(k)) return; seen.add(k);
      edges.push({ data:{ id:'grp-'+ge.source+'->grp-'+ge.target, source:'grp-'+ge.source, target:'grp-'+ge.target, kind:'group', type:ge.type } });
    });
    return { nodes, edges };
  }

  function buildGroupDrill(gid){
    const g = groupById[gid]; const members = g.node_ids; const memberSet = new Set(members);
    const relatedIds = new Set(members); const edges = [];
    DATA.edges.forEach(e => {
      if (bridgeMode && !(isBridge(e.from) || isBridge(e.to))) return;
      const s=e.from, t=e.to, sIn=memberSet.has(s), tIn=memberSet.has(t);
      if (sIn && tIn){ edges.push({ data:{ id:s+'->'+t, source:s, target:t, type:e.type, label:e.label } }); }
      else if (sIn || tIn){ const other = sIn?t:s; if (nodeById[other] && !memberSet.has(other)){ relatedIds.add(other); edges.push({ data:{ id:s+'->'+t, source:s, target:t, type:e.type, label:e.label } }); } }
    });
    const nodes = [];
    relatedIds.forEach(id => { const n=nodeById[id]; if(!n) return; const isMember=memberSet.has(id);
      nodes.push({ data:{ id, label:n.name, kind:'node', group:n.group, gname: groupById[n.group]?groupById[n.group].name:'', stage:n.stage, src:n.src||'', layer:n.layer||'', brief:n.brief||'', member:isMember, mode:isMember?'member':'stub' } }); });
    nodes.sort((a,b)=>{ const am=a.data.member?0:1, bm=b.data.member?0:1; if(am!==bm) return am-bm;
      if(a.data.member) return (groupNodeIndex[a.data.id]||0)-(groupNodeIndex[b.data.id]||0); return a.data.id<b.data.id?-1:1; });
    return { nodes, edges };
  }

  function buildBridgeView(){
    const bridgeIds = DATA.nodes.filter(n => isBridge(n.id)).map(n => n.id);
    const idSet = new Set(bridgeIds);
    const nodes = bridgeIds.map(id => { const n=nodeById[id]; return { data:{ id, label:n.name, kind:'node', group:n.group, gname:groupById[n.group]?groupById[n.group].name:'', stage:n.stage, src:n.src||'', brief:n.brief||'', member:true, mode:'member' } }; });
    const edges = [];
    DATA.edges.forEach(e => { if(idSet.has(e.from) && idSet.has(e.to)) edges.push({ data:{ id:e.from+'->'+e.to, source:e.from, target:e.to, type:e.type, label:e.label } }); });
    return { nodes, edges };
  }

  function render(doFit=true){
    let els, mode;
    if (bridgeMode){ els = buildBridgeView(); mode='桥接主题'; }
    else if (currentGroup === null){ els = buildGroupNodes(); mode='组级'; }
    else { els = buildGroupDrill(currentGroup); mode = currentGroup+' · '+(groupById[currentGroup]?groupById[currentGroup].name:''); }
    cy.elements().remove(); cy.add(els.nodes); cy.add(els.edges);
    cy.nodes().forEach(n => { const d=n.data(); let op=1; if(bridgeMode){ if(d.kind==='node' && !isBridge(d.id)) op=0.08; if(d.kind==='group') op=0.15; } n.style('opacity', op); });
    $('zcount').textContent = cy.nodes().length;
    $('zmode').textContent = mode;
    cy.layout({ name:'dagre', rankDir:'LR', nodeSep:40, rankSep:70, padding:40 }).run();
    if (doFit) cy.fit(undefined, 50);
    updateCrumb();
  }

  function goBack(){ if (currentGroup !== null){ currentGroup=null; render(); } }
  function toggleBridge(){ bridgeMode=!bridgeMode; currentGroup=null; $('bridgebtn').classList.toggle('on', bridgeMode); render(); }

  const cy = cytoscape({
    container: document.getElementById('graph'), elements: [],
    style: [
      { selector:'node', style:{ label:'data(label)', 'text-valign':'center','text-halign':'center', color:'#fff', 'font-size':9, 'text-wrap':'wrap', 'text-max-width':90 } },
      { selector:'node[kind="group"]', style:{ 'background-color': function(ele){ return DATA.groupColor[ele.data('group')] || '#243040'; }, 'border-width':3,'border-color':'rgba(255,255,255,0.5)','width':130,'height':46,'font-size':12,'text-wrap':'wrap','text-max-width':116 } },
      { selector:'node[kind="node"]', style:{ 'background-color': function(ele){ return DATA.groupColor[ele.data('group')] || '#2b3550'; }, 'border-width':1,'border-color':'rgba(255,255,255,0.35)','width':58,'height':30, shape:'round-rectangle' } },
      { selector:'node[kind="node"][mode="stub"]', style:{ 'background-color':'#2a2e38','border-color':'#555a66','width':52,'height':26, opacity:0.55, 'font-size':8 } },
      { selector:'edge', style:{ 'curve-style':'bezier','target-arrow-shape':'triangle','arrow-scale':0.7, 'line-color': function(ele){ return EDGE_COLOR[ele.data('type')] || '#4a5265'; }, 'target-arrow-color': function(ele){ return EDGE_COLOR[ele.data('type')] || '#4a5265'; }, 'width':1.3 } },
      { selector:'edge[type="prerequisite"]', style:{ 'width':2.0 } },
      { selector:'edge[type="variant"]', style:{ 'line-style':'dashed' } },
      { selector:'edge[type="cooccurrence"]', style:{ 'line-style':'dotted' } }
    ],
    layout: { name:'dagre', rankDir:'LR', nodeSep:40, rankSep:70, padding:40 },
    wheelSensitivity:0.3, minZoom:0.05, maxZoom:5
  });
  window.__cy = cy;

  cy.on('tap', 'node', (evt) => { const d=evt.target.data();
    if (currentGroup===null){ if(d.kind==='group'){ currentGroup=d.group; render(); } }
    else { if(d.kind==='node'){ window.location.href = '../11-node-pages/'+d.id+'.html'; } } });

  function handleHash(){ const h=location.hash.replace(/^#/,''); if(!h) return;
    if (groupById[h]){ currentGroup=h; bridgeMode=false; $('bridgebtn').classList.remove('on'); render(); }
    else if (nodeById[h]){ const gp=nodeToGroup[h]; if(gp){ currentGroup=gp; bridgeMode=false; render(); } } }
  window.addEventListener('hashchange', handleHash);

  function updateCrumb(){ if (currentGroup!==null && !bridgeMode){ const gp=groupById[currentGroup];
      crumb.style.display='inline-flex'; $('backbtn').style.display='inline-block';
      crumb.innerHTML='<b>'+currentGroup+'</b> '+escapeHtml(gp?gp.name:'')+' <span style="color:var(--dim)">· '+(gp?gp.node_ids.length:0)+' 节点</span>'; }
    else { crumb.style.display='none'; $('backbtn').style.display='none'; } }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function buildLegend(){ const lg=$('legend'); let html='';
    html += '<b>组节点</b>（'+DATA.groups.length+' 组，彩色，点击下钻）<br>';
    html += '<b>知识节点</b>（'+DATA.nodes.length+' 个，点击跳转节点页）<br><b>边类型</b>：<br>';
    Object.keys(EDGE_COLOR).forEach(t => { html += '<span class="sw" style="background:'+EDGE_COLOR[t]+'"></span>'+(EDGE_LABEL[t]||t)+'<br>'; });
    if (DATA.meta.has_bridge) html += '<b>桥接模式</b>：仅显示桥接主题及其连接边';
    lg.innerHTML = html; }

  const gl=$('glegend');
  DATA.groups.forEach(g => { const d=document.createElement('div'); d.className='row';
    const sw=document.createElement('span'); sw.className='sw'; sw.style.background=DATA.groupColor[g.id]||'#243040';
    const txt=document.createElement('span'); txt.textContent=g.name+' ('+g.id+')';
    d.appendChild(sw); d.appendChild(txt);
    d.addEventListener('click', () => { currentGroup=g.id; bridgeMode=false; $('bridgebtn').classList.remove('on'); render(); });
    gl.appendChild(d); });

  $('bridgebtn').addEventListener('click', toggleBridge);
  $('backbtn').addEventListener('click', goBack);
  buildLegend(); render(); handleHash();
})();
</script>
</body>
